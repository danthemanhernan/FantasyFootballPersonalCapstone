services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fantasy_hud
      POSTGRES_USER: fantasy_hud
      POSTGRES_PASSWORD: fantasy_hud_dev
    ports:
      - "55432:5432"
    volumes:
      - v6_postgres_data:/var/lib/postgresql/data
      - ../../services/read_model/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_hud -d fantasy_hud"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - v6_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  v6_postgres_data:
  v6_redis_data:
