services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fantasy_hud
      POSTGRES_USER: fantasy_hud
      POSTGRES_PASSWORD: fantasy_hud_dev
    ports:
      - "55432:5432"
    volumes:
      - fantasy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_hud -d fantasy_hud"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../../services/read_model
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://fantasy_hud:fantasy_hud_dev@postgres:5432/fantasy_hud
    command: ["uv", "run", "python", "migrate.py"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - fantasy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../../services/read_model
    environment:
      READ_MODEL_BACKEND: postgres-redis
      POSTGRES_DSN: postgresql://fantasy_hud:fantasy_hud_dev@postgres:5432/fantasy_hud
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: local-auth-secret-change-me-000000000000000000
      PROVIDER_ENCRYPTION_KEY: local-provider-key-change-me-000000000000000
      INGEST_API_KEY: local-ingest-key
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5174:80"

  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fantasy_hud_dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fantasy_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  fantasy_postgres_data:
  fantasy_redis_data:
  fantasy_grafana_data:
