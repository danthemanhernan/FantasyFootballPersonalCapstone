[project]
name = "fantasy-hud-read-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "asyncpg>=0.29,<1",
  "redis>=5,<7",
  "python-dotenv>=1.0,<2",
  "websockets>=13,<16",
  "argon2-cffi>=23,<26",
  "cryptography>=43,<47",
  "email-validator>=2,<3",
  "httpx>=0.27,<1",
  "pyjwt>=2.9,<3",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
]

[dependency-groups]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
