[project]
name = "fantasy-hud-probability"
version = "0.1.0"
description = "Reproducible matchup win-probability baselines for Fantasy HUD"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["fantasy_probability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
